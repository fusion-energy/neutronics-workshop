project:
  type: book
  output-dir: _build/html
  # An allow list rather than the whole repository so that the copies of the
  # tasks in the workshop folders, the helper scripts and the agent reference
  # docs are not rendered as pages.
  render:
    - index.qmd
    - docs/workshop_slides.md
    - docs/running_the_tasks.md
    - docs/install_*.md
    - tasks/task_*/README.md
    - tasks/task_*/[0-9]*.py

book:
  title: "Fusion Energy Neutronics Workshop"
  author: "Jonathan Shimwell"
  favicon: docs/logo.png
  search: true
  repo-url: https://github.com/fusion-energy/neutronics-workshop
  repo-branch: main
  repo-actions: [edit, issue, source]
  sidebar:
    logo: docs/logo.png
    style: docked
    tools:
      - icon: github
        href: https://github.com/fusion-energy/neutronics-workshop
        text: GitHub repository
      - icon: rocket-takeoff
        href: https://mybinder.org/v2/gh/fusion-energy/neutronics-workshop/HEAD
        text: Launch on Binder
  chapters:
