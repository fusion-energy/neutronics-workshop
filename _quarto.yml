# Jupyter Book parsed the task text with CommonMark, pandoc is stricter, so three
# extensions are needed to keep the same rendering:
#   autolink_bare_uris             bare urls become links
#   emoji                          :point_right: style shortcodes render as emoji
#   lists_without_preceding_blankline   a bullet list may follow a paragraph line
#                                  directly, which the workshop text does a lot
from: markdown+autolink_bare_uris+emoji+lists_without_preceding_blankline

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    code-copy: true
    code-tools: true
    code-overflow: wrap
    fig-format: retina
    toc-depth: 3
    # Jupyter Book left the chapters unnumbered, quarto books number them by default
    number-sections: false

execute:
  # Executed results are cached in _freeze so that a rebuild only re-runs the
  # tasks whose source has changed.
  freeze: auto
  daemon: false

jupyter: python3
