name: deploy-book

# Run this when the master or main branch changes
on:
  workflow_dispatch:
  release:
    types: [created]
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

# This job installs dependencies, builds the book, and pushes it to `gh-pages`
jobs:
  deploy-book:
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DISPLAY: :99  
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgl1 libglx-mesa0 libgl1-mesa-dev libglu1-mesa-dev freeglut3-dev libosmesa6 libosmesa6-dev libgles2-mesa-dev libarchive-dev libpangocairo-1.0-0 xvfb
      - name: Setup virtual display
        run: |
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          sleep 3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # cache: pip # Implicitly uses requirements.txt for cache key
      - name: setup environment
        run: python -m pip install -r requirements.txt
        
      - name: Cache nuclear data
        id: cache-nuclear-data
        uses: actions/cache@v4
        with:
          path: /home/runner/nuclear_data
          key: nuclear-data-${{ hashFiles('postBuild') }}

      - name: Download nuclear data
        if: steps.cache-nuclear-data.outputs.cache-hit != 'true'
        run: python postBuild /home/runner/nuclear_data

    # (optional) Cache your executed notebooks between runs
    # if you have config:
    # execute:
    #   execute_notebooks: cache
    # - name: cache executed notebooks
    #   uses: actions/cache@v4
    #   with:
    #     path: _build/.jupyter_cache
    #     key: jupyter-book-cache-${{ hashFiles('requirements.txt') }}

    # Build the 
      # - name: Setup tmate session
      #   uses: mxschmitt/action-tmate@v3
      - name: Build the book
        run: |
          # Execute all task notebooks except 4_sphere_iterative_per_batch_ww.ipynb.
          # That notebook hangs on the CI OpenMC build (the iterative MAGIC weight
          # windows request excessive particle splitting), which was causing this
          # job to hit the 6 hour limit and get cancelled before the book deployed.
          find tasks -mindepth 2 -maxdepth 2 -name '*.ipynb' \
            ! -path 'tasks/task_14_variance_reduction/4_sphere_iterative_per_batch_ww.ipynb' \
            -print0 | xargs -0 -r jupyter nbconvert --to notebook --execute --inplace
          pip install jupyter-book==1.0.4
          jupyter-book build .

      # - name: Deploy docs to GitHub Pages
      #   uses: peaceiris/actions-gh-pages@v4
      #   with:
      #     publish_branch: gh-pages
      #     github_token: ${{ secrets.GITHUB_TOKEN }}
      #     publish_dir: _build/html
      #     # with next release of actions-gh-pages
      #     # issue to allow force_orphan will be fixed
      #     # https://github.com/peaceiris/actions-gh-pages/issues/455
      #     # force_orphan: true
      #     keep_files: false

      # Upload the book's HTML as an artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_build/html"
          name: github-pages

      # Deploy the book's HTML to GitHub Pages.
      # Releases deploy as well as pushes to main, otherwise a release spends
      # hours executing every notebook and then skips the deployment.
      - name: Deploy to GitHub Pages
        if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        id: deployment
        uses: actions/deploy-pages@v4