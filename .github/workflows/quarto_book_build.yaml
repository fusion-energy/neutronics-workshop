name: deploy-book

# Run this when the master or main branch changes
on:
  workflow_dispatch:
  release:
    types: [created]
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

# This job installs dependencies, builds the book, and pushes it to `gh-pages`
jobs:
  deploy-book:
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DISPLAY: :99  
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libgl1 libglx-mesa0 libgl1-mesa-dev libglu1-mesa-dev freeglut3-dev libosmesa6 libosmesa6-dev libgles2-mesa-dev libarchive-dev libpangocairo-1.0-0 xvfb
      - name: Setup virtual display
        run: |
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          sleep 3
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # cache: pip # Implicitly uses requirements.txt for cache key
      - name: setup environment
        run: python -m pip install -r requirements.txt

      # Pinned so that a Quarto release cannot break the build without a commit
      # here, bump it when you want the newer version.
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - name: Cache nuclear data
        id: cache-nuclear-data
        uses: actions/cache@v4
        with:
          path: /home/runner/nuclear_data
          key: nuclear-data-${{ hashFiles('postBuild') }}

      - name: Download nuclear data
        if: steps.cache-nuclear-data.outputs.cache-hit != 'true'
        run: python postBuild /home/runner/nuclear_data

      # Quarto writes the result of every executed task into _freeze. Restoring
      # it means a build only re-runs the tasks whose source changed since the
      # last build instead of all of them, which used to take most of the six
      # hour job limit. Changing requirements.txt starts a fresh cache so that a
      # dependency update re-runs everything.
      - name: Cache executed tasks
        uses: actions/cache@v4
        with:
          path: _freeze
          key: freeze-${{ hashFiles('requirements.txt') }}-${{ github.sha }}
          restore-keys: |
            freeze-${{ hashFiles('requirements.txt') }}-

      - name: Build the book
        run: quarto render

      # Upload the book's HTML as an artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_build/html"
          name: github-pages

      # Deploy the book's HTML to GitHub Pages.
      # Releases deploy as well as pushes to main, otherwise a release spends
      # hours executing every task and then skips the deployment.
      - name: Deploy to GitHub Pages
        if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        id: deployment
        uses: actions/deploy-pages@v4
